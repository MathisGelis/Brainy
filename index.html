<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eceef7" />
    <meta name="description" content="Cockpit : objectifs, notes, habitudes, todo et budget." />
    <title>Cockpit</title>
    <script>
      // Thème appliqué avant le premier rendu (pas de flash) : préférence enregistrée, sinon système.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('cockpit.theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#07070b' : '#eceef7'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
